<!DOCTYPE html>
<html lang="es">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Mi Cronograma de Estudio - Pomodoro</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght=300;400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.13.1/font/bootstrap-icons.min.css">
  <link rel="stylesheet" href="styles.css">
</head>

<body class="bg-slate-50 text-slate-800 min-h-screen flex flex-col antialiased">

  <!-- Toggle dark/light mode -->
  <div class="fixed top-4 left-4 z-[200] flex items-center gap-2">
    <i class="bi bi-sun-fill text-slate-400 text-sm"></i>
    <button id="theme-toggle" onclick="toggleTheme()" class="relative w-12 h-6 rounded-full bg-slate-300 transition-colors duration-300 focus:outline-none">
      <span id="theme-knob" class="absolute top-0.5 left-0.5 w-5 h-5 bg-white rounded-full shadow transition-transform duration-300"></span>
    </button>
    <i class="bi bi-moon-fill text-slate-400 text-sm"></i>
  </div>

  <!-- VISTA DE DOMINGO -->
  <div id="sunday-view" class="fixed inset-0 z-[100] hidden bg-slate-50 flex items-center justify-center p-6">
    <div class="text-center">
      <div class="text-8xl mb-6"><i style="color:rgb(105, 23, 143)" class="bi bi-yin-yang"></i></div>
      <h1 class="text-4xl font-black text-slate-900 mb-2">¡Hoy es tu día de descanso!</h1>
      <p class="text-slate-500 text-lg">Disfruta tu tiempo libre, hoy no hay estudios.</p>
    </div>
  </div>

  <!-- Estructura principal -->
  <main id="main-content" class="grid lg:grid-cols-12 gap-8 p-6 max-w-7xl mx-auto w-full">

    <!-- Columna: Temporizador -->
    <section class="lg:col-span-8 flex flex-col gap-6">
      <div class="bg-white rounded-2xl border border-slate-200 p-8 md:p-12 shadow-sm sticky top-6 flex flex-col justify-between min-h-[600px]">
        <div class="text-center flex flex-col items-center justify-center flex-1">
          <div id="timer-display" class="tracking-tighter text-slate-950 mb-8 select-none leading-none timer-font">
            25:00
          </div>
          <div class="relative w-full max-w-xl mx-auto mb-8 h-4 bg-slate-100 rounded-full overflow-hidden shadow-inner">
            <div id="timer-progress" class="h-full bg-rose-500 transition-all duration-300 rounded-full" style="width: 100%"></div>
          </div>
          <div class="flex items-center justify-between w-full max-w-xs px-4 py-2 mb-2 rounded-xl bg-slate-50 border border-slate-150">
            <span class="text-xs font-bold text-slate-600">Autogestionar flujo</span>
            <label class="relative inline-flex items-center cursor-pointer">
              <input type="checkbox" id="toggle-auto-advance" checked class="sr-only peer">
              <div class="w-9 h-5 bg-slate-200 peer-focus:outline-none rounded-full peer peer-checked:after:translate-x-full rtl:peer-checked:after:-translate-x-full peer-checked:after:border-white after:content-[''] after:absolute after:top-[2px] after:start-[2px] after:bg-white after:border-slate-300 after:border after:rounded-full after:h-4 after:w-4 after:transition-all peer-checked:bg-slate-900"></div>
            </label>
          </div>
        </div>
        <div class="border-t border-slate-100 pt-6">
          <div class="flex justify-center gap-4 w-full max-w-lg mx-auto">
            <button id="btn-start" onclick="startTimer()" class="flex-1 py-4 bg-slate-950 text-white rounded-2xl font-bold text-base hover:bg-slate-800 transition-all duration-150 flex items-center justify-center gap-2.5 shadow-lg shadow-slate-200 active:scale-[0.99]">
              <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="2.5" stroke="currentColor" class="w-5 h-5">
                <path stroke-linecap="round" stroke-linejoin="round" d="M5.25 5.653c0-.856.917-1.398 1.667-.986l11.54 6.347a1.125 1.125 0 0 1 0 1.972l-11.54 6.347a1.125 1.125 0 0 1-1.667-.986V5.653Z" />
              </svg> Iniciar
            </button>
            <button id="btn-pause" onclick="pauseTimer()" disabled class="flex-1 py-4 bg-slate-100 text-slate-700 rounded-2xl font-bold text-base hover:bg-slate-200 disabled:opacity-40 disabled:pointer-events-none transition-all duration-150 flex items-center justify-center gap-2.5 active:scale-[0.99]">
              <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="2.5" stroke="currentColor" class="w-5 h-5">
                <path stroke-linecap="round" stroke-linejoin="round" d="M15.75 5.25v13.5m-7.5-13.5v13.5" />
              </svg> Pausar
            </button>
            <button id="btn-reset" onclick="resetTimer()" class="p-4 bg-slate-50 text-slate-500 hover:text-slate-800 rounded-2xl border border-slate-200 transition-all duration-150 active:scale-[0.97]">
              <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="2.5" stroke="currentColor" class="w-5 h-5">
                <path stroke-linecap="round" stroke-linejoin="round" d="M16.023 9.348h4.992v-.001M2.985 19.644v-4.992m0 0h4.992m-4.993 0 3.181 3.183a8.25 8.25 0 0 0 13.803-3.7M4.031 9.865a8.25 8.25 0 0 1 13.803-3.7l3.181 3.182m0-4.991v4.99" />
              </svg>
            </button>
          </div>
        </div>
      </div>
    </section>

    <!-- Columna: Horario -->
    <section class="lg:col-span-4 flex flex-col gap-6">
      <div class="flex flex-col gap-1 bg-white p-1 rounded-xl border border-slate-200 shadow-sm">
        <div class="flex">
          <button onclick="switchTab('lunes')" class="tab-btn flex-1 py-2 px-2.5 text-xs sm:text-sm font-semibold rounded-lg transition-colors duration-150 text-slate-600 hover:text-slate-900 active-tab bg-slate-900 text-white" id="tab-lunes">Lunes</button>
          <button onclick="switchTab('martes')" class="tab-btn flex-1 py-2 px-2.5 text-xs sm:text-sm font-semibold rounded-lg transition-colors duration-150 text-slate-600 hover:text-slate-900" id="tab-martes">Martes</button>
          <button onclick="switchTab('miercoles')" class="tab-btn flex-1 py-2 px-2.5 text-xs sm:text-sm font-semibold rounded-lg transition-colors duration-150 text-slate-600 hover:text-slate-900" id="tab-miercoles">Miércoles</button>
        </div>
        <div class="flex">
          <button onclick="switchTab('jueves')" class="tab-btn flex-1 py-2 px-2.5 text-xs sm:text-sm font-semibold rounded-lg transition-colors duration-150 text-slate-600 hover:text-slate-900" id="tab-jueves">Jueves</button>
          <button onclick="switchTab('viernes')" class="tab-btn flex-1 py-2 px-2.5 text-xs sm:text-sm font-semibold rounded-lg transition-colors duration-150 text-slate-600 hover:text-slate-900" id="tab-viernes">Viernes</button>
          <button onclick="switchTab('sabado')" class="tab-btn flex-1 py-2 px-2.5 text-xs sm:text-sm font-semibold rounded-lg transition-colors duration-150 text-slate-600 hover:text-slate-900" id="tab-sabado">Sábado</button>
        </div>
      </div>

      <div id="days-wrapper" class="bg-white rounded-2xl border border-slate-200 p-5 shadow-sm min-h-[500px]">
        <div class="flex justify-between items-center mb-6 pb-4 border-b border-slate-100">
          <div class="flex items-center gap-3">
            <button id="btn-back-course" onclick="backToCourseList()" class="hidden w-8 h-8 rounded-lg bg-slate-100 hover:bg-slate-200 flex items-center justify-center text-slate-600 transition-colors duration-150 flex-shrink-0">
              <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="2.5" stroke="currentColor" class="w-4 h-4">
                <path stroke-linecap="round" stroke-linejoin="round" d="M10.5 19.5 3 12m0 0 7.5-7.5M3 12h18" />
              </svg>
            </button>
            <div>
              <h3 id="day-title" class="text-lg font-bold text-slate-900 capitalize">Lunes</h3>
              <p id="day-subtitle" class="text-[11px] text-slate-400">Elige un curso para empezar</p>
            </div>
          </div>
          <button onclick="resetDayCheckboxes()" class="text-xs text-slate-500 hover:text-slate-800 transition-colors duration-150 flex items-center gap-1.5 font-medium">
            <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="2" stroke="currentColor" class="w-3.5 h-3.5">
              <path stroke-linecap="round" stroke-linejoin="round" d="M16.023 9.348h4.992v-.001M2.985 19.644v-4.992m0 0h4.992m-4.993 0 3.181 3.183a8.25 8.25 0 0 0 13.803-3.7M4.031 9.865a8.25 8.25 0 0 1 13.803-3.7l3.181 3.182m0-4.991v4.99" />
            </svg> Reiniciar checks
          </button>
        </div>
        <div id="timeline-list" class="space-y-4 relative"></div>
      </div>
    </section>
  </main>

  <!-- MODAL DE ALARMA -->
  <div id="custom-alarm-modal" class="fixed inset-0 z-50 flex items-center justify-center bg-slate-950/80 backdrop-blur-sm opacity-0 pointer-events-none transition-all duration-300">
    <div class="bg-white rounded-2xl p-8 max-w-md w-full mx-4 shadow-2xl border border-slate-100 text-center transform scale-95 transition-transform duration-300" id="alarm-modal-card">
      <div class="w-20 h-20 bg-rose-100 text-rose-600 rounded-full flex items-center justify-center mx-auto mb-6 animate-pulse ring-8 ring-rose-50">
        <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="2" stroke="currentColor" class="w-10 h-10 animate-bounce">
          <path stroke-linecap="round" stroke-linejoin="round" d="M14.857 17.082a23.848 23.848 0 0 0 5.454-1.31A8.967 8.967 0 0 1 18 9.75V9A6 6 0 0 0 6 9v.75a8.967 8.967 0 0 1-2.312 6.022c1.733.64 3.56 1.085 5.455 1.31m5.714 0a24.255 24.255 0 0 1-5.714 0m5.714 0a3 3 0 1 1-5.714 0" />
        </svg>
      </div>
      <h3 class="text-2xl font-extrabold text-slate-900 mb-2">¡Tiempo Completado!</h3>
      <p id="modal-alarm-message" class="text-slate-600 text-sm mb-6 leading-relaxed"></p>
      <button onclick="dismissAlarmAndContinue()" class="w-full py-4 bg-rose-600 text-white font-bold rounded-xl shadow-lg shadow-rose-200 hover:bg-rose-700 active:scale-[0.98] transition flex items-center justify-center gap-2 text-base">
        Silenciar y Continuar
      </button>
    </div>
  </div>

  <!-- MODAL DE ERROR DE DIA -->
  <div id="day-error-modal" class="fixed inset-0 z-50 flex items-center justify-center bg-slate-950/80 backdrop-blur-sm opacity-0 pointer-events-none transition-all duration-300">
    <div class="bg-white rounded-2xl p-8 max-w-sm w-full mx-4 shadow-2xl text-center">
      <h3 class="text-xl font-bold text-slate-900 mb-2">¡Ups!</h3>
      <p class="text-slate-600 mb-6">Hoy no te toca estos cursos.</p>
      <button onclick="document.getElementById('day-error-modal').classList.add('opacity-0', 'pointer-events-none')" class="w-full py-3 bg-slate-900 text-white font-bold rounded-xl">Entendido</button>
    </div>
  </div>

  <script src="script.js"></script>
</body>

</html>
